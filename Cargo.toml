[workspace]

members = ["lib", "apps/*"]
resolver = "3"


[workspace.package]

authors = ["Vincent Hiribarren"]
description = "DNSKit"
edition = "2024"
version = "0.1.0"
license = "MIT"
license-file = "LICENSE.md"


[workspace.dependencies]

anyhow = "1.0.102"
async-trait = "0.1.89"
clap = {version = "4.5.60", features = ["derive"]}
hex = "0.4.3"
rand = "0.10.0"
tokio = {version = "1.49.0", features = ["net", "rt", "macros"] }
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = {version = "0.3.22", features = ["env-filter"]}
