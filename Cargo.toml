[workspace]

members = ["lib", "apps/*"]
resolver = "3"


[workspace.package]

authors = ["Vincent Hiribarren"]
description = "DNS tools"
edition = "2024"
version = "0.1.0"


[workspace.dependencies]

hex = "0.4.3"
tokio = {version = "1.49.0", features = ["net", "rt", "macros"] }
tracing = "0.1.44"
tracing-subscriber = {version = "0.3.22", features = ["env-filter"]}
