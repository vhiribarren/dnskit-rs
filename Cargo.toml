[workspace]

members = ["lib", "apps/*"]
resolver = "3"


[workspace.package]

authors = ["Vincent Hiribarren"]
description = "DNS tools"
edition = "2024"
version = "0.1.0"
license = "MIT"
license-file = "LICENSE.md"


[workspace.dependencies]

anyhow = "1.0.102"
hex = "0.4.3"
rand = "0.10.0"
tokio = {version = "1.49.0", features = ["net", "rt", "macros"] }
tracing = "0.1.44"
tracing-subscriber = {version = "0.3.22", features = ["env-filter"]}
